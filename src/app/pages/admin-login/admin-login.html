<section class="admin-login">
  <div class="login-panel">
    <p class="eyebrow">EZ-Trucks account</p>
    <h1>{{ mode === 'login' ? 'Inloggen' : 'Account maken' }}</h1>

    <div class="mode-tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="setMode('login')">Inloggen</button>
      <button type="button" [class.active]="mode === 'register'" (click)="setMode('register')">Registreren</button>
    </div>

    @if (errorMessage) {
      <div class="alert">{{ errorMessage }}</div>
    }

    @if (mode === 'login') {
      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <label>
          E-mail of admin gebruikersnaam
          <input type="text" formControlName="username" autocomplete="username" />
        </label>

        <label>
          Wachtwoord
          <input type="password" formControlName="password" autocomplete="current-password" />
        </label>

        <button class="primary-button" type="submit" [disabled]="loading">
          {{ loading ? 'Inloggen...' : 'Inloggen' }}
        </button>
      </form>
    } @else {
      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
        <label>
          Naam
          <input type="text" formControlName="name" autocomplete="name" />
        </label>

        <label>
          E-mail
          <input type="email" formControlName="email" autocomplete="email" />
        </label>

        <label>
          Wachtwoord
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>

        <button class="primary-button" type="submit" [disabled]="loading">
          {{ loading ? 'Account maken...' : 'Account maken' }}
        </button>
      </form>
    }
  </div>
</section>
